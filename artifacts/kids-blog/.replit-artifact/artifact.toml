kind = "web"
previewPath = "/"
title = "Liew Yang's Adventure Diary"
version = "1.0.0"
id = "artifacts/kids-blog"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23021

[services.development]
run = "pnpm --filter @workspace/kids-blog run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kids-blog", "run", "build" ]
publicDir = "artifacts/kids-blog/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23021"
BASE_PATH = "/"
